name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        numpy: [latest]
        include:
          - python: '3.10'
            numpy: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.numpy == 'minimum'
        run: python -m pip install numpy==1.24.0
      - run: python -m pytest -W error -m 'not gpu'
      - run: python -m ruff check src tests examples scripts
      - run: python -m build
      - run: python -m twine check dist/*

  distributions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_artifacts.py

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -W error -m 'not gpu'
