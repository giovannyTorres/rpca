name: CUDA tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda:
    # Register a Linux x64 runner with CUDA and the custom label "gpu".
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,gpu]'
      - name: Require real CUDA hardware
        run: python -c "import torch; assert torch.cuda.is_available(), 'CUDA hardware required'"
      - run: python -m pytest -W error -m gpu
