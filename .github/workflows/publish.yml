name: Publish to PyPI
on:
  push:
    branches: ['release/0.1.2']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag, for example v0.1.2
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'giovannyTorres/rpca'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch CPU backend for parity tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - name: Match release tag and installed metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.1.2' }}
        run: python -c 'import importlib.metadata, os, rpca_kit; version = importlib.metadata.version("rpca-kit"); assert version == rpca_kit.__version__; assert os.environ["RELEASE_TAG"] == "v" + version, "Tag must match the package version"'
      - run: python -m pytest -W error -m 'not gpu'
      - run: python -m ruff check src tests examples scripts
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rpca-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish using the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
