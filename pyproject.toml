[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpca-kit"
version = "0.1.0"
description = "Robust PCA with NumPy and optional PyTorch CPU/CUDA backends"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["robust-pca", "rpca", "low-rank", "sparse", "cuda", "matrix-decomposition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/giovannyTorres/rpca"
Documentation = "https://github.com/giovannyTorres/rpca/blob/main/README.md"
Issues = "https://github.com/giovannyTorres/rpca/issues"

[project.optional-dependencies]
gpu = ["torch>=2.2"]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "build>=1.2", "twine>=6", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpca_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires an available CUDA device"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
